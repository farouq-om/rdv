<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestion de Rendez-vous{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">RDV Platform</a>
        <div class="d-flex align-items-center">
            <a href="{% url 'liste_prestataires' %}" class="btn btn-outline-light btn-sm me-2">Prestataires</a>
            {% if user.is_authenticated %}
    {% if user.role == "prestataire" %}
        <a href="{% url 'mon_espace_prestataire' %}" class="btn btn-outline-light btn-sm me-2">Mon espace</a>
    {% else %}
        <a href="{% url 'mes_rendezvous' %}" class="btn btn-outline-light btn-sm me-2">Mes rendez-vous</a>
    {% endif %}
                <span class="navbar-text text-white me-3">Bonjour, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm me-2">Connexion</a>
                <a href="{% url 'inscription' %}" class="btn btn-light btn-sm">Inscription</a>
            {% endif %}
        </div>
    </div>
</nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
